apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./platform-underlay
  dependsOn:
    - name: secrets
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${PLATFORM_SOURCE}
  postBuild:
    substitute:
      CLUSTER_CONFIG: ${CLUSTER_CONFIG}
      PLATFORM_SOURCE: ${PLATFORM_SOURCE}

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secrets
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./platform-secrets
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${PLATFORM_SOURCE}
  postBuild:
    substitute:
      CLUSTER_CONFIG: ${CLUSTER_CONFIG}
      PLATFORM_SOURCE: ${PLATFORM_SOURCE}
