apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: operators
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./platform-underlay/0-operators
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${PLATFORM_SOURCE}
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: ${CLUSTER_CONFIG}

---
