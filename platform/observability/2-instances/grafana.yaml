apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  namespace: grafana-system
  labels:
    dashboards: grafana
spec:
  config:
    server:
      root_url: https://grafana.${CLUSTER_ZONE}
    security:
      admin_user: admin
      admin_password: pass123
      cookie_secure: "true"
    auth.anonymous:
      enabled: "false"
    users:
      viewers_can_edit: "false"
    analytics:
      reporting_enabled: "false"
      check_for_updates: "false"
  deployment:
    spec:
      template:
        spec:
          nodeSelector:
            node-role.kubernetes.io/observability: ""
          tolerations:
            - key: node-role.kubernetes.io/observability
              operator: Exists
              effect: NoSchedule
          containers:
            - name: grafana
              resources:
                requests:
                  cpu: 50m
                  memory: 192Mi
                limits:
                  memory: 384Mi
