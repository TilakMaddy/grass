apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: prometheus
  namespace: grafana-system
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  allowCrossNamespaceImport: true
  datasource:
    name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://kube-prometheus-stack-prometheus.prometheus-system.svc.cluster.local:9090
    isDefault: true
    jsonData:
      timeInterval: 30s

---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: loki
  namespace: grafana-system
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  allowCrossNamespaceImport: true
  datasource:
    name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki.loki-system.svc.cluster.local:3100
    isDefault: false
    jsonData:
      maxLines: 1000
