apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secrets-operators
  namespace: flux-system
spec:
  interval: 10m0s
  path: ${PLATFORM_PATH_PREFIX:=.}/platform/secrets/0-operators
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${PLATFORM_SOURCE}
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: ${CLUSTER_CONFIG}

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secrets-eso
  namespace: flux-system
spec:
  interval: 10m0s
  path: ${PLATFORM_PATH_PREFIX:=.}/platform/secrets/1-eso
  dependsOn:
    - name: secrets-operators
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${PLATFORM_SOURCE}
  postBuild:
    substitute:
      PLATFORM_NAMESPACE: ${PLATFORM_NAMESPACE}
    substituteFrom:
      - kind: ConfigMap
        name: ${CLUSTER_CONFIG}
